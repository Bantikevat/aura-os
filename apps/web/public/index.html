<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — Banti's 3D AI Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <!-- Clean Aurora Glow Background -->
  <div class="ambient-glow"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="cyan-orb"></div>
      <div class="brand-titles">
        <h1>AURA 3D</h1>
        <span>बंटी का पर्सनल 3D लाइफ अवतार</span>
      </div>
    </div>

    <!-- Status & Face Uploader -->
    <div class="header-right">
      <div class="status-pill">
        <span class="pulse-dot"></span> <span id="statusLabel">3D AVATAR ONLINE</span>
      </div>
      <button id="uploadFaceBtn" class="action-pill-btn">📷 अपनी फ़ोटो बदलें</button>
      <input type="file" id="faceInput" accept="image/*" style="display:none;">
    </div>
  </header>

  <!-- Main 3D Viewport -->
  <main class="stage-viewport">
    
    <!-- 3D WebGL Canvas Container -->
    <div id="threeContainer" class="webgl-canvas-box">
      <!-- Floating Instructions Hint -->
      <div class="viewport-tip">
        <span>🖱️ माउस से 3D अवतार को 360° घुमाएं और ज़ूम करें</span>
      </div>
    </div>

    <!-- Floating Subtitle Dialogue (Hindi) -->
    <div class="speech-dialogue-bubble" id="speechBubble">
      <div class="speaker-label">AURA (बंटी का अवतार):</div>
      <p id="subtitlesText">"नमस्ते बंटी भाई! अब कोई कन्फ़्यूज़न नहीं। मैं आपका असली 3D अवतार हूँ। मैं आपके साथ मुँह हिलाकर (Lip-sync) बोलूँगा और हाथ हिलाकर बात करूँगा।"</p>
    </div>

    <!-- Bottom Controls & Action Bar -->
    <div class="bottom-action-dock">
      
      <!-- Hand Gestures & Movements -->
      <div class="gestures-strip">
        <span class="gestures-label">हाथ के मूवमेंट:</span>
        <button class="gesture-btn" data-anim="wave">👋 हाथ हिलाओ (Wave)</button>
        <button class="gesture-btn" data-anim="talk">🗣️ बात करते हुए हाथ हिलाओ</button>
        <button class="gesture-btn" data-anim="think">🤔 सोचने की मुद्रा (Think)</button>
        <button class="gesture-btn" data-anim="thumbs">👍 हाँ बोलो (Thumbs Up)</button>
        <button class="gesture-btn active" data-anim="idle">🧘 शांत खड़े रहो (Idle)</button>
      </div>

      <!-- Dialogue Input Bar -->
      <div class="dialogue-input-row">
        <input type="text" id="userInput" placeholder="मुझसे हिंदी या इंग्लिश में कुछ भी बुलवाएँ..." value="नमस्ते बंटी! मैं तुम्हारा 3D अवतार हूँ।">
        <button id="speakActionBtn" class="glow-send-btn">🔊 बुलवाएं (Speak)</button>
        <button id="micActionBtn" class="mic-glow-btn" title="माइक से बोलें">🎙️ माइक</button>
      </div>

    </div>

  </main>

  <script src="avatar3d.js"></script>
</body>
</html>
