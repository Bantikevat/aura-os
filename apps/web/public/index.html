<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — Personal 3D Avatar (Photo-to-Avatar)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div class="aurora-bg"></div>

  <!-- Header -->
  <header class="command-bar">
    <div class="brand">
      <div class="pulse-orb"></div>
      <div class="brand-text">
        <h1>AURA 3D</h1>
        <span class="subtext">PERSONAL AVATAR & VOICE ENGINE</span>
      </div>
    </div>

    <!-- Actions: Create My Avatar & Voices -->
    <div class="header-actions">
      <button id="openSelfieModalBtn" class="magic-pill-btn">📸 Make Avatar with My Photo (Selfie)</button>
      <button id="avatarUploadBtn" class="pill-btn">📂 Upload .GLB File</button>
      <input type="file" id="glbFileInput" accept=".glb,.gltf" style="display:none;">
      
      <div class="voice-picker-wrap">
        <label for="voiceSelect">🗣️ Voice:</label>
        <select id="voiceSelect" class="styled-select"></select>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <div class="avatar-stage-container">
    <div id="canvasContainer" class="canvas-3d-wrap">
      <div class="canvas-overlay">
        <div class="avatar-status-pill">
          <span class="live-dot"></span> <span id="avatarStateText">IDLE · WAITING FOR COMMAND</span>
        </div>
      </div>
      <div id="loadingSpinner" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
        <p>Loading your 3D Face & Avatar...</p>
      </div>
    </div>

    <!-- Interactive Speech & Action Controls -->
    <div class="speech-control-panel">
      <!-- Activity Gestures -->
      <div class="activity-bar">
        <span class="bar-title">ACTIVITIES:</span>
        <button class="act-btn active" data-action="idle">🧍 Idle</button>
        <button class="act-btn" data-action="talk">🗣️ Speak</button>
        <button class="act-btn" data-action="nod">👍 Agree</button>
        <button class="act-btn" data-action="think">🤔 Think</button>
        <button class="act-btn" data-action="wave">👋 Wave</button>
      </div>

      <!-- Dialogue & Voice Interaction Box -->
      <div class="speech-box">
        <div class="avatar-subtitles" id="subtitlesBox">
          "Banti! 'Make Avatar with My Photo' button dabao, apni photo upload karo ya selfie lo, aur main bilkul tumhari tarah dikhne lagunga!"
        </div>

        <div class="speech-input-row">
          <input type="text" id="speakInput" placeholder="AURA se kya bulwana chahte hain? Type karein aur Enter dabayein..." value="Banti! 'Make Avatar with My Photo' button dabao aur main bilkul tumhari tarah ban jaunga.">
          <button id="speakBtn" class="primary-glow-btn">🔊 Speak Out Loud</button>
          <button id="micBtn" class="mic-btn" title="Speak through Microphone">🎙️</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Ready Player Me Photo Avatar Modal -->
  <div id="rpmModal" class="modal-backdrop" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <div class="title-row">
          <span class="sparkle">✨</span>
          <h3>Create Your Exact 3D Face Avatar</h3>
        </div>
        <button id="closeModalBtn" class="close-x">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="rpmIframe" class="rpm-frame" allow="camera *; microphone *; clipboard-write"></iframe>
      </div>
    </div>
  </div>

  <script src="avatar.js"></script>
</body>
</html>
